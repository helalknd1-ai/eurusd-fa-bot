name: EURUSD FA Persian – Telegram

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'انتخاب زمان اجرا'
        required: false
        default: 'watch'
        type: choice
        options:
          - morning
          - news_morning
          - us_preopen
          - evening
          - manual
          - watch
          - weekly
          - verify

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Slot Name Based on Execution Time
        id: select_slot
        run: |
          # استخراج ساعت فعلی به وقت تهران
          HOUR=$(TZ="Asia/Tehran" date +%H)
          
          # بررسی اینکه آیا اجرا دستی بوده یا از طریق سایت cron-job (بدون پارامتر) است
          if [ "${{ github.event.inputs.slot }}" != "watch" ]; then
            # اگر شما به صورت دستی از داخل سایت گیت‌هاب گزینه‌ای انتخاب کردید، همان را اجرا کن
            echo "SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
          else
            # اگر از cron-job در ساعت 10 صبح اجرا شد -> ثبت پیش‌بینی لندن
            if [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 12 ]; then
              echo "SLOT=morning" >> $GITHUB_ENV
            # اگر از cron-job در ساعت 21:30 شب اجرا شد -> ارزیابی و ثبت عملکرد
            elif [ "$HOUR" -ge 20 ] && [ "$HOUR" -lt 23 ]; then
              echo "SLOT=evening" >> $GITHUB_ENV
            # در غیر این صورت -> رصد اخبار فوری
            else
              echo "SLOT=watch" >> $GITHUB_ENV
            fi
          fi

      - name: Run EURUSD Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_VOICE: "true"
          VOICE_NAME: "fa-IR-DilaraNeural"
          VOICE_RATE: "-12%"
          VOICE_PITCH: "+0Hz"
          NEWS_IMPACT: "High,Medium"
          TZ: "Asia/Tehran"
        run: |
          # اجرای پایتون با متغیر هوشمندی که در مرحله قبل ساخته شد
          python -u eurusd_telegram.py --slot ${{ env.SLOT }}

      - name: Commit data files
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          FILES_CHANGED=false
          
          # اضافه شدن last_view.json به سیستم ذخیره‌سازی
          for file in seen_events.json predictions.json performance.json last_view.json; do
            if [ -f "$file" ]; then
              git add "$file"
              FILES_CHANGED=true
            fi
          done
          
          if [ "$FILES_CHANGED" = "true" ]; then
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Update bot data [skip ci]"
              git push
            fi
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ خطا در ربات EURUSD - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M')" \
            || true
