name: EURUSD FA Persian – Telegram

on:
  schedule:
    # زمان‌های دقیق تهران (UTC + 3:30)
    - cron: '0 4 * * 1-5'      # 07:30 تهران - تحلیل صبح
    - cron: '10 4 * * 1-5'     # 07:40 تهران - خبر صبح
    - cron: '30 12 * * 1-5'    # 16:00 تهران - قبل بازار آمریکا
    - cron: '30 14 * * 1-5'    # 18:00 تهران - جمع‌بندی عصر
    # چک اخبار فوری هر 30 دقیقه در ساعات مهم
    - cron: '0,30 5-17 * * 1-5'
  workflow_dispatch:
    inputs:
      slot:
        description: 'انتخاب زمان اجرا'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - news_morning
          - us_preopen
          - evening
          - manual

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install edge-tts gtts feedparser beautifulsoup4 python-dotenv pytz jdatetime lxml groq

      - name: Determine slot based on time
        id: slot
        run: |
          if [ "${{ github.event.inputs.slot }}" != "" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ='Asia/Tehran' date +%H)
            MIN=$(TZ='Asia/Tehran' date +%M)
            TOTAL=$((10#$HOUR * 60 + 10#$MIN))
            if [ $TOTAL -ge 420 ] && [ $TOTAL -lt 435 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ $TOTAL -ge 460 ] && [ $TOTAL -lt 475 ]; then
              echo "slot=news_morning" >> $GITHUB_OUTPUT
            elif [ $TOTAL -ge 955 ] && [ $TOTAL -lt 975 ]; then
              echo "slot=us_preopen" >> $GITHUB_OUTPUT
            elif [ $TOTAL -ge 1075 ] && [ $TOTAL -lt 1095 ]; then
              echo "slot=evening" >> $GITHUB_OUTPUT
            else
              echo "slot=watch" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Selected slot: $(cat $GITHUB_OUTPUT)"

      - name: Run EURUSD Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_VOICE: "true"
          VOICE_NAME: "fa-IR-FaridNeural"
          VOICE_RATE: "-8%"
          VOICE_PITCH: "+0Hz"
          NEWS_IMPACT: "High,Medium"
          TZ: "Asia/Tehran"
        run: |
          python -u eurusd_telegram.py --slot ${{ steps.slot.outputs.slot }}

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="⚠️ *خطا در ربات EURUSD*%0A%0Aاجرا با خطا مواجه شد.%0Aزمان: $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M')%0A%0Aلطفاً لاگ گیت‌هاب را بررسی کنید." || true        run: |
          python eurusd_telegram.py --slot morning
