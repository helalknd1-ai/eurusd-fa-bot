name: EURUSD FA Persian – Telegram

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'انتخاب زمان اجرا'
        required: false
        default: 'watch'
        type: choice
        options:
          - morning
          - news_morning
          - us_preopen
          - evening
          - manual
          - watch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show run info
        run: |
          echo "=========================================="
          echo "🚀 EURUSD Bot Run"
          echo "=========================================="
          echo "Slot: ${{ github.event.inputs.slot }}"
          echo "Time (Tehran): $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')"
          echo "Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

      - name: Run EURUSD Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_VOICE: "true"
          VOICE_NAME: "fa-IR-DilaraNeural"
          VOICE_RATE: "-12%"
          VOICE_PITCH: "+0Hz"
          NEWS_IMPACT: "High,Medium"
          TZ: "Asia/Tehran"
        run: |
          python -u eurusd_telegram.py --slot ${{ github.event.inputs.slot }}

      - name: Commit seen events file
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -f seen_events.json ]; then
            git add seen_events.json
            
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Update seen events [skip ci]"
              git push
              echo "✅ seen_events.json updated"
            else
              echo "ℹ️ No changes in seen_events.json"
            fi
          else
            echo "ℹ️ seen_events.json not found"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          TIME=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M')
          
          MESSAGE="⚠️ *خطا در ربات EURUSD*%0A%0A📌 Slot: \`${SLOT}\`%0A🕒 زمان: ${TIME}%0A%0Aلطفاً لاگ GitHub Actions را بررسی کنید."
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}" \
            || true
