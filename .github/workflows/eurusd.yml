name: EURUSD FA Persian – Telegram

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'انتخاب زمان اجرا'
        required: false
        default: 'watch'
        type: choice
        options:
          - morning
          - news_morning
          - us_preopen
          - evening
          - manual
          - watch
          - weekly
          - verify

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Slot Name
        id: select_slot
        run: |
          # بدون هیچ دخالت زمانی! فقط به دستور ورودی گوش می‌دهد.
          # اگر دستوری نیامد (مثل اجرای کرون‌جاب هر نیم ساعته)، پیش‌فرض watch را اجرا می‌کند.
          SLOT_VAL="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT_VAL" ]; then
            SLOT_VAL="watch"
          fi
          echo "SLOT=$SLOT_VAL" >> $GITHUB_ENV

      - name: Run EURUSD Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_VOICE: "true"
          VOICE_NAME: "fa-IR-DilaraNeural"
          VOICE_RATE: "-12%"
          VOICE_PITCH: "+0Hz"
          NEWS_IMPACT: "High,Medium"
          TZ: "Asia/Tehran"
        run: |
          python -u eurusd_telegram.py --slot ${{ env.SLOT }}

      - name: Commit data files
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          FILES_CHANGED=false
          
          for file in seen_events.json predictions.json performance.json last_view.json; do
            if [ -f "$file" ]; then
              git add "$file"
              FILES_CHANGED=true
            fi
          done
          
          if [ "$FILES_CHANGED" = "true" ]; then
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Update bot data [skip ci]"
              git push
            fi
          fi
          
